services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hostelmate_test
      POSTGRES_USER: hostelmate_test
      POSTGRES_PASSWORD: hostelmate_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostelmate_test -d hostelmate_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
